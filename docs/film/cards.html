<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../public/majlis.css">
<style>
 html,body{margin:0;width:1920px;height:1080px;background:#0B1626;overflow:hidden}
 .card1920{position:relative;width:1920px;height:1080px;display:grid;place-items:center;
   background:radial-gradient(1200px 700px at 50% 0%,rgba(255,196,110,.3),transparent 70%),linear-gradient(180deg,#122438,#070F18)}
 .sadu{position:absolute;left:0;right:0;height:14px}
 .sadu.top{top:0}.sadu.bot{bottom:0}
 .in{text-align:center;position:relative;z-index:2}
 .crest{width:190px;height:250px;margin:0 auto 18px}
 .t1{font-family:var(--display);font-weight:800;font-size:170px;line-height:1;color:#FBF0DA;margin:0}
 .t2{font:700 34px/1 Tajawal,sans-serif;letter-spacing:.26em;color:#F0AE4C;margin-top:26px}
 .t3{font:700 42px/1.5 Tajawal,sans-serif;color:rgba(251,240,218,.82);margin-top:46px}
 .pills{display:flex;gap:18px;justify-content:center;margin-top:54px}
 .pill{font:700 34px/1 Tajawal,sans-serif;color:#FFD79A;border:2px solid rgba(240,174,76,.6);border-radius:999px;padding:18px 34px;background:rgba(11,22,38,.5)}
 .end .t1{font-size:120px}
</style></head><body>
<div class="card1920" id="title">
  <div class="sadu top"></div><div class="sadu bot"></div>
  <div class="in">
    <svg class="crest" viewBox="0 0 64 84"><path d="M32 4v10" stroke="#F0AE4C" stroke-width="3"/><rect x="24" y="14" width="16" height="6" rx="3" fill="#F0AE4C"/><path d="M16 28q16-8 32 0l4 32q-20 10-40 0z" fill="#4A2E12"/><path d="M16 28q16-8 32 0l4 32q-20 10-40 0z" fill="none" stroke="#F0AE4C" stroke-width="2.5"/><path d="M22 34q10-5 20 0l2 24q-12 6-24 0z" fill="rgba(255,215,154,.9)"/><path d="M48 34l6 10-6 10-6-10z" fill="#3ED9B0"/><path d="M20 72q12 8 24 0" stroke="#F0AE4C" stroke-width="3" fill="none"/></svg>
    <h1 class="t1">مجلس بارتي</h1>
    <div class="t2">MAJLIS PARTY</div>
    <div class="t3">حفلة من ٢٠ إلى ٤٥ هاتفًا · شاشة واحدة · فريقان</div>
  </div>
</div>
