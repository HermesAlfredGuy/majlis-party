<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مجلس بارتي — Majlis Party · Host</title>
<link rel="preload" href="/vendor/baloo-800-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/majlis.css">
</head>
<body class="host" data-phase="lobby">
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <header id="top">
      <div id="title">
        <div id="crest">
          <svg viewBox="0 0 64 84" aria-hidden="true">
            <path d="M32 4v10" stroke="#F0AE4C" stroke-width="3"/>
            <rect x="24" y="14" width="16" height="6" rx="3" fill="#F0AE4C"/>
            <path d="M16 28q16-8 32 0l4 32q-20 10-40 0z" fill="#4A2E12"/>
            <path d="M16 28q16-8 32 0l4 32q-20 10-40 0z" fill="none" stroke="#F0AE4C" stroke-width="2.5"/>
            <path d="M22 34q10-5 20 0l2 24q-12 6-24 0z" fill="rgba(255,215,154,.9)"/>
            <path d="M48 34l6 10-6 10-6-10z" fill="#3ED9B0"/>
            <path d="M20 72q12 8 24 0" stroke="#F0AE4C" stroke-width="3" fill="none"/>
          </svg>
        </div>
        <div><b id="t-ar">مجلس بارتي</b><span id="t-en">MAJLIS PARTY</span></div>
      </div>
      <span class="chip mid" id="round">—</span>
      <div id="meta"><span class="chip" id="format">—</span><span class="chip" id="playerschip">٠ لاعب</span><span id="timer"></span></div>
    </header>
    <div id="scoreboard"></div>
    <div id="rulebar"></div>
    <div id="dartlegend"></div>
    <div id="centre"></div>
    <div class="boardhud">
      <div class="vbx" id="boardvote">
        <h3>صوّتوا على الطريق</h3>
        <div id="boardvoteopts"></div>
        <div class="who" id="boardvotetimer">٦ ثوانٍ · الأغلبية تفوز</div>
      </div>
      <div class="dicetag" id="boarddice">
        <div class="d" data-team="1">◆</div>
        <div class="d" data-team="2">◆</div>
        <div class="who" id="boarddicelabel">النرد</div>
      </div>
      <div class="landing" id="boardlanding"></div>
    </div>
    <div id="voterail"></div>
    <div id="gamelabel"></div>
    <div id="admin"></div>
    <footer id="foot">
      <div id="joinbox"><span id="joinline"></span></div>
      <span id="hintline">A = لوحة التحكم · F = ملء الشاشة</span>
      <button id="snd" class="snd" type="button" aria-pressed="true">🔊 الصوت</button>
    </footer>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/gltf-loader.js"></script>
<script src="/board-path.js"></script>
<script src="/party-art.js"></script>
<script src="/majlis-glb.js"></script>
<script src="/majlis-audio.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/host-scene.js"></script>
<script src="/host.js"></script>
</body>
</html>
